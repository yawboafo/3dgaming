services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: town
      POSTGRES_PASSWORD: town
      POSTGRES_DB: town
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U town']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  server:
    profiles: [full]
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      PORT: 2567
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://town:town@postgres:5432/town
    ports: ['2567:2567']
    depends_on: [postgres, redis]
volumes:
  pgdata:
